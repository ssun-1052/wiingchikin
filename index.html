<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>Wiing Chickin - Future of Home Robot & Companion</title>
  <style>
    @font-face {
      font-family: 'Samsung Sharp Sans';
      src: url('fonts/samsungsharpsans-bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Samsung Sharp Sans';
      src: url('fonts/samsungsharpsans-medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Aeonik';
      src: url('fonts/Aeonik Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }

    html {
      overflow-x: hidden;
      /* zoom은 JS에서 동적으로 설정 */
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #0081e8;
      --blue-hover: #3ca8fd;
      --bg-light: #edf3f8;
      --font-sharp: 'Samsung Sharp Sans', 'Arial Black', sans-serif;
      --font-aeonik: 'Aeonik', 'Inter', sans-serif;
    }

    body {
      background: white;
      font-family: var(--font-aeonik);
      width: 1920px;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      width: 1920px;
      height: 177px;
      display: flex;
      align-items: center;
      padding: 0 50px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 1820px;
    }

    /* Logo */
    .logo {
      position: relative;
      width: 128px;
      height: 77px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .logo-bg-top {
      position: absolute;
      top: 0; left: 0;
      width: 102px;
      height: 39px;
      background: var(--blue);
    }
    .logo-bg-bottom {
      position: absolute;
      top: 38px; left: 0;
      width: 128px;
      height: 39px;
      background: var(--blue);
    }
    .logo-text {
      position: absolute;
      top: 2.71px;
      left: 5.42px;
      font-family: var(--font-aeonik);
      font-weight: 500;
      font-size: 35.208px;
      line-height: 1;
      letter-spacing: -0.7042px;
      color: white;
      text-transform: capitalize;
      white-space: nowrap;
    }

    /* Nav */
    nav {
      display: flex;
      gap: 50px;
      align-items: center;
    }
    .nav-item {
      position: relative;
      font-family: var(--font-aeonik);
      font-weight: 500;
      font-size: 26px;
      letter-spacing: -0.52px;
      line-height: 1;
      color: var(--blue);
      text-transform: capitalize;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .nav-item::after {
      content: '';
      position: absolute;
      left: 2px;
      bottom: -4px;
      width: calc(100% - 2px);
      height: 1.5px;
      background: var(--blue-hover);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.2s ease;
    }
    .nav-item:hover {
      color: var(--blue-hover);
    }
    .nav-item:hover::after {
      transform: scaleX(1);
    }

    /* Header right */
    .header-right {
      position: relative;
      width: 196.291px;
      height: 41px;
      flex-shrink: 0;
    }
    .header-right .union-icon {
      position: absolute;
      left: 0; top: 0;
      width: 38px;
      height: 41px;
    }
    .header-right .x-icon {
      position: absolute;
      left: 54.01px;
      top: 12.22px;
      width: 17.846px;
      height: 17.846px;
    }
    .header-right .samsung-logo-img {
      position: absolute;
      left: 87.64px;
      top: 12.91px;
      width: 108.648px;
      height: 17.15px;
    }

    /* ── HERO VIDEO ── */
    .hero {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #000;
      flex-shrink: 0;
      overflow: hidden;
    }
    .hero video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 컨트롤 오버레이 */
    .hero-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 60px 50px;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 100%);
      display: flex;
      flex-direction: column;
      gap: 22px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .hero:hover .hero-controls,
    .hero.paused .hero-controls { opacity: 1; }

    /* 진행 바 */
    .progress-wrap {
      position: relative;
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 2px;
      pointer-events: none;
      transition: width 0.1s linear;
    }
    .progress-wrap:hover .progress-fill { background: var(--blue); }
    /* 드래그 핸들 */
    .progress-wrap::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%) scale(0);
      width: 14px; height: 14px;
      border-radius: 50%;
      background: white;
      transition: transform 0.15s ease, left 0s;
      pointer-events: none;
    }
    .progress-wrap:hover::after { transform: translate(-50%, -50%) scale(1); }

    /* 하단 버튼 행 */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .ctrl-btn {
      width: 48px;
      height: 48px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0.9;
      transition: opacity 0.15s, transform 0.15s;
      flex-shrink: 0;
    }
    .ctrl-btn:hover { opacity: 1; transform: scale(1.1); }
    .ctrl-btn svg { width: 100%; height: 100%; }

    /* 시간 표시 */
    .ctrl-time {
      font-family: var(--font-aeonik);
      font-size: 22px;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.5px;
      white-space: nowrap;
      user-select: none;
    }

    /* ── CONTENT SECTION ── */
    .content {
      background: var(--bg-light);
      width: 1920px;
    }

    /* Section block: heading row */
    .section-block {
      padding: 84px 50px 50px;
    }

    .list-row {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 1820px;
      padding-bottom: 19px;
      cursor: pointer;
    }
    .list-row::after {
      content: '';
      position: absolute;
      bottom: 14px;
      left: 0;
      width: calc(100% - 24px); /* 1796px = 1820 - 24 */
      height: 2px;
      background: var(--blue);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }
    .list-row:hover::after {
      transform: scaleX(1);
    }

    .section-heading {
      font-family: var(--font-sharp);
      font-weight: 700;
      font-size: 80px;
      letter-spacing: -1.6px;
      color: var(--blue);
      text-transform: capitalize;
      line-height: 0.9;
      white-space: nowrap;
    }

    /* Arrow icon (default / hover swap) */
    .arrow-wrap {
      position: relative;
      width: 146px;
      height: 146px;
      flex-shrink: 0;
    }
    .arrow-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      transition: opacity 0.2s ease;
    }
    .arrow-wrap .arrow-hover {
      opacity: 0;
    }
    .list-row:hover .arrow-wrap .arrow-default {
      opacity: 0;
    }
    .list-row:hover .arrow-wrap .arrow-hover {
      opacity: 1;
    }

    /* ── THUMBNAILS (horizontal scroll) ── */
    .thumbnail-section {
      width: 1920px;
      padding: 10px 0 10px 50px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      cursor: grab;
      user-select: none;
      will-change: scroll-position;
    }
    .thumbnail-section.is-dragging .thumb-card {
      pointer-events: none; /* 드래그 중 hover 효과 방지 */
    }
    .thumbnail-section::-webkit-scrollbar {
      display: none;
    }

    .thumbnail-track {
      display: flex;
      flex-wrap: nowrap;
      gap: 26px;
    }
    /* 마지막 카드 이후 50px 여백 보장 (padding-right는 일부 브라우저에서 무시됨) */
    .thumbnail-spacer {
      flex: 0 0 50px;
    }

    .thumb-card {
      position: relative;
      flex: 0 0 811px;
      height: 515px;
      border-radius: 20px;
      overflow: hidden;
      background: #d9d9d9;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
    .thumb-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Hover gradient overlay */
    .thumb-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.3) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .thumb-card:hover::after {
      opacity: 1;
    }

    /* Hover label */
    .thumb-label {
      position: absolute;
      bottom: 0;
      left: 0;
      padding: 50px;
      font-family: var(--font-sharp);
      font-weight: 700;
      font-size: 50px;
      letter-spacing: -1px;
      line-height: 0.9;
      color: white;
      text-transform: capitalize;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1;
    }
    .thumb-card:hover .thumb-label {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Scroll Reveal ── */
    .reveal {
      opacity: 0;
      transform: translateY(48px);
      /* ease-out expo: 빠르게 시작, 부드럽게 착지 */
      transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.in-view {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">

      <!-- Logo -->
      <div class="logo">
        <div class="logo-bg-top"></div>
        <div class="logo-bg-bottom"></div>
        <div class="logo-text">Wiing<br>chickin</div>

      <!-- Nav -->

  <!-- HERO VIDEO -->
  <div class="hero" id="hero">
    <video id="hero-video" src="assets/videos/intro-final.mp4"
           autoplay muted playsinline loop preload="auto"></video>

    <div class="hero-controls" id="hero-controls">
      <!-- 진행 바 -->
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <!-- 버튼 행 -->
      <div class="controls-row">
        <!-- 재생/일시정지 -->
        <button class="ctrl-btn" id="btn-play" aria-label="재생/일시정지">
          <!-- Pause icon (기본: 재생 중) -->
          <svg id="icon-pause" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="8" width="10" height="32" rx="2" fill="white"/>
            <rect x="28" y="8" width="10" height="32" rx="2" fill="white"/>
          </svg>
          <!-- Play icon (일시정지 시 표시) -->
          <svg id="icon-play" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
            <path d="M10 8 L40 24 L10 40 Z" fill="white"/>
          </svg>
        </button>

        <!-- 음소거 -->
        <button class="ctrl-btn" id="btn-mute" aria-label="음소거/해제">
          <!-- Volume icon -->
          <svg id="icon-volume" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 17H18L28 9V39L18 31H10V17Z" fill="white"/>
            <path d="M33 18C35.2 20.2 35.2 27.8 33 30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M37 14C41 18 41 30 37 34" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <!-- Mute icon -->
          <svg id="icon-mute" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
            <path d="M10 17H18L28 9V39L18 31H10V17Z" fill="white"/>
            <line x1="33" y1="17" x2="43" y2="31" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="43" y1="17" x2="33" y2="31" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

        <!-- 시간 -->

  <!-- CONTENT -->
  <section class="content">

    <!-- Product 섹션 제목 -->

    <!-- Product 썸네일 (가로 스크롤) -->

        <a class="thumb-card" href="weero.html">

          <span class="thumb-label">Weero</span>

        <a class="thumb-card" href="flow.html">
          <img class="thumb-img" src="assets/thumbnail/Flow-thumbnail.png" alt="Flow">

        <a class="thumb-card" href="egg.html">

    <!-- About 섹션 제목 -->

        <div class="arrow-wrap">
          <img class="arrow-default" src="assets/icons/arrow-default.svg" alt="">

        </div>
      </div>

    <!-- Credits 섹션 제목 -->
    <div class="section-block">
      <div class="list-row">
        <h2 class="section-heading">Credits.</h2>
        <div class="arrow-wrap">
          <img class="arrow-default" src="assets/icons/arrow-default.svg" alt="">
          <img class="arrow-hover"   src="assets/icons/arrow-hover.svg" alt="">
        </div>
      </div>

  </section>

  <script>
    /* ── 히어로 비디오 컨트롤 ── */
    const heroEl    = document.getElementById('hero');
    const video     = document.getElementById('hero-video');
    const btnPlay   = document.getElementById('btn-play');
    const btnMute   = document.getElementById('btn-mute');
    const progWrap  = document.getElementById('progress-wrap');
    const progFill  = document.getElementById('progress-fill');
    const ctrlTime  = document.getElementById('ctrl-time');
    const iconPlay  = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const iconVol   = document.getElementById('icon-volume');
    const iconMute  = document.getElementById('icon-mute');

    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    function updatePlayIcon() {
      if (video.paused) {
        iconPlay.style.display  = '';
        iconPause.style.display = 'none';
        heroEl.classList.add('paused');
      } else {
        iconPlay.style.display  = 'none';
        iconPause.style.display = '';
        heroEl.classList.remove('paused');
      }
    }

    function updateMuteIcon() {
      iconVol.style.display  = video.muted ? 'none' : '';
      iconMute.style.display = video.muted ? '' : 'none';
    }

    /* 재생/일시정지 */
    btnPlay.addEventListener('click', () => {
      video.paused ? video.play() : video.pause();
    });
    video.addEventListener('play',  updatePlayIcon);
    video.addEventListener('pause', updatePlayIcon);

    /* 음소거 */
    btnMute.addEventListener('click', () => {
      video.muted = !video.muted;
      updateMuteIcon();
    });

    /* 진행 바 업데이트 */
    video.addEventListener('timeupdate', () => {
      if (!video.duration) return;
      const pct = (video.currentTime / video.duration) * 100;
      progFill.style.width = pct + '%';
      progWrap.style.setProperty('--prog', pct + '%');
      ctrlTime.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
    });

    video.addEventListener('loadedmetadata', () => {
      ctrlTime.textContent = `0:00 / ${fmt(video.duration)}`;
    });

    /* 진행 바 클릭/드래그로 탐색 */
    let isSeeking = false;

    function seekTo(e) {
      const rect = progWrap.getBoundingClientRect();
      const pct  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      video.currentTime = pct * video.duration;
    }

    progWrap.addEventListener('mousedown', (e) => {
      isSeeking = true;
      seekTo(e);
    });
    window.addEventListener('mousemove', (e) => {
      if (!isSeeking) return;
      seekTo(e);
      /* progress-wrap::after 핸들 위치 수동 업데이트 */
      const rect = progWrap.getBoundingClientRect();
      const pct  = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      progFill.style.width = pct + '%';
    });
    window.addEventListener('mouseup', () => { isSeeking = false; });

    /* 초기 상태 */
    updatePlayIcon();
    updateMuteIcon();

    /* ── 반응형 zoom ── */
    const BASE_WIDTH = 1920;

    function applyZoom() {
      const zoom = window.innerWidth / BASE_WIDTH;
      document.documentElement.style.zoom = zoom;
    }

    window.addEventListener('resize', applyZoom);
    applyZoom();

    /* ── 썸네일 드래그 + 관성 스크롤 ── */
    const slider = document.querySelector('.thumbnail-section');
    let isDragging = false;
    let hasDragged = false;   /* 실제로 이동이 발생했는지 */
    let clickBlocked = false; /* 드래그 직후 click 이벤트 차단 */
    let startX = 0;
    let scrollStart = 0;
    let velocity = 0;
    let prevX = 0;
    let prevTime = 0;
    let rafId = null;
    const DRAG_THRESHOLD = 5; /* px — 이 이상 움직여야 드래그로 인식 */

    function stopMomentum() {
      cancelAnimationFrame(rafId);
      rafId = null;
    }

    function runMomentum() {
      if (Math.abs(velocity) < 0.4) { velocity = 0; return; }
      slider.scrollLeft += velocity;
      velocity *= 0.93;
      rafId = requestAnimationFrame(runMomentum);
    }

    slider.addEventListener('mousedown', (e) => {
      stopMomentum();
      isDragging = true;
      hasDragged = false;
      velocity = 0;
      startX = e.clientX;
      scrollStart = slider.scrollLeft;
      prevX = e.clientX;
      prevTime = performance.now();
      slider.style.cursor = 'grabbing';
      /* is-dragging 클래스는 실제 이동 후에 붙임 */
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      if (!hasDragged) {
        if (Math.abs(dx) < DRAG_THRESHOLD) return; /* 임계값 미만은 무시 */
        hasDragged = true;
        slider.classList.add('is-dragging');
      }
      e.preventDefault();
      slider.scrollLeft = scrollStart - dx;

      const now = performance.now();
      const dt = now - prevTime;
      if (dt > 0) velocity = (prevX - e.clientX) / dt * 16;
      prevX = e.clientX;
      prevTime = now;
    }, { passive: false });

    window.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      slider.style.cursor = 'grab';
      slider.classList.remove('is-dragging');
      if (hasDragged) {
        clickBlocked = true; /* 드래그였으면 바로 이어지는 click 차단 */
        rafId = requestAnimationFrame(runMomentum);
      }
      hasDragged = false;
    });

    /* 드래그 직후 발생하는 click으로 링크 이동 방지 */
    slider.addEventListener('click', (e) => {
      if (clickBlocked) {
        e.preventDefault();
        clickBlocked = false;
      }
    }, true);

    /* ── Scroll Reveal (Intersection Observer) ── */
    const REVEAL_OPTIONS = {
      threshold: 0.1,
      rootMargin: '0px 0px -40px 0px'  /* 뷰포트 하단 40px 전에 미리 트리거 */
    };

    /* 섹션 제목 행 (.list-row) — 하나씩 순서대로 올라옴 */
    const listObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
        } else {
          entry.target.classList.remove('in-view');
        }
      });
    }, REVEAL_OPTIONS);

    document.querySelectorAll('.list-row').forEach(el => {
      el.classList.add('reveal');
      listObserver.observe(el);
    });

    /* 히어로 섹션 — 페이지 로드 시 fade-in */
    heroEl.classList.add('reveal');
    requestAnimationFrame(() => heroEl.classList.add('in-view'));

    /* 썸네일 카드 — 섹션이 보이면 카드를 80ms 간격으로 순차 등장 */
    const thumbObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const cards = entry.target.querySelectorAll('.thumb-card');
        if (entry.isIntersecting) {
          /* 진입: 순서대로 등장 */
          cards.forEach((card, i) => {
            card.style.transitionDelay = `${i * 80}ms`;
            requestAnimationFrame(() => card.classList.add('in-view'));
          });
        } else {
          /* 이탈: 역순으로 사라짐 */
          cards.forEach((card, i) => {
            card.style.transitionDelay = `${(cards.length - 1 - i) * 60}ms`;
            card.classList.remove('in-view');
          });
        }
      });
    }, { threshold: 0.05 });

    document.querySelector('.thumbnail-section')
      .querySelectorAll('.thumb-card')
      .forEach(c => c.classList.add('reveal'));
    thumbObserver.observe(document.querySelector('.thumbnail-section'));
  </script>
</body>
</html>
