<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>Wiing Chickin - Product</title>
  <style>
    @font-face {
      font-family: 'Samsung Sharp Sans';
      src: url('fonts/samsungsharpsans-bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Samsung Sharp Sans';
      src: url('fonts/samsungsharpsans-medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Aeonik';
      src: url('fonts/Aeonik Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Aeonik';
      src: url('fonts/aeoniktrial-regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }

    html { overflow-x: hidden; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #0081e8;
      --blue-hover: #3ca8fd;
      --bg-light: #edf3f8;
      --font-sharp: 'Samsung Sharp Sans', 'Arial Black', sans-serif;
      --font-aeonik: 'Aeonik', 'Inter', sans-serif;
    }

    body {
      background: var(--bg-light);
      font-family: var(--font-aeonik);
      width: 1920px;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      width: 1920px;
      height: 177px;
      display: flex;
      align-items: center;
      padding: 0 50px;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 1820px;
    }

    /* Logo */
    .logo {
      position: relative;
      width: 128px;
      height: 77px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .logo-bg-top {
      position: absolute;
      top: 0; left: 0;
      width: 102px; height: 39px;
      background: var(--blue);
    }
    .logo-bg-bottom {
      position: absolute;
      top: 38px; left: 0;
      width: 128px; height: 39px;
      background: var(--blue);
    }
    .logo-text {
      position: absolute;
      top: 2.71px; left: 5.42px;
      font-family: var(--font-aeonik);
      font-weight: 500;
      font-size: 35.208px;
      line-height: 1;
      letter-spacing: -0.7042px;
      color: white;
      text-transform: capitalize;
      white-space: nowrap;
    }

    /* Nav */
    nav {
      display: flex;
      gap: 50px;
      align-items: center;
    }
    .nav-item {
      position: relative;
      font-family: var(--font-aeonik);
      font-weight: 500;
      font-size: 26px;
      letter-spacing: -0.52px;
      line-height: 1;
      color: var(--blue);
      text-transform: capitalize;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .nav-item::after {
      content: '';
      position: absolute;
      left: 2px;
      bottom: -4px;
      width: calc(100% - 2px);
      height: 1.5px;
      background: var(--blue-hover);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.2s ease;
    }
    .nav-item:hover { color: var(--blue-hover); }
    .nav-item:hover::after { transform: scaleX(1); }
    .nav-item.active {
      color: var(--blue);
      font-weight: 700;
    }

    /* Header right */
    .header-right {
      position: relative;
      width: 196.291px;
      height: 41px;
      flex-shrink: 0;
    }
    .header-right .union-icon {
      position: absolute;
      left: 0; top: 0;
      width: 38px; height: 41px;
    }
    .header-right .x-icon {
      position: absolute;
      left: 54.01px; top: 12.22px;
      width: 17.846px; height: 17.846px;
    }
    .header-right .samsung-logo-img {
      position: absolute;
      left: 87.64px; top: 12.91px;
      width: 108.648px; height: 17.15px;
    }

    /* ── PAGE HEADING ── */
    .page-heading-section {
      padding: 84px 50px 50px;
      width: 1920px;
    }
    .page-heading-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 1820px;
      padding-bottom: 19px;
    }
    .page-heading {
      font-family: var(--font-sharp);
      font-weight: 700;
      font-size: 120px;
      letter-spacing: -2.4px;
      line-height: 0.9;
      color: #d9e5f0;           /* 피그마 그대로: 배경과 어우러지는 워터마크 색 */
      text-transform: capitalize;
      white-space: nowrap;
    }

    /* ── PRODUCT CARDS ── */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 50px;
      padding: 0 50px 50px;
      width: 1920px;
    }

    .product-card {
      position: relative;
      width: 1820px;
      height: 1024px;
      border-radius: 30px;
      overflow: hidden;
      background: #d9d9d9;
      cursor: pointer;
    }
    .product-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Hover overlay */
    .product-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 30px;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.3) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .product-card:hover::after { opacity: 1; }

    /* 피그마 product-page-thumbnail-hover: 100px padding, 32px gap, 좌하단 */
    .product-card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      padding: 100px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      color: white;
      text-transform: capitalize;
      white-space: nowrap;
      line-height: 0.9;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1;
    }
    .product-card:hover .product-card-info {
      opacity: 1;
      transform: translateY(0);
    }
    .product-card-name {
      font-family: var(--font-sharp);
      font-weight: 700;
      font-size: 120px;
      letter-spacing: -2.4px;
    }
    .product-card-desc {
      font-family: var(--font-aeonik);
      font-weight: 400;
      font-size: 50px;
      letter-spacing: -1px;
    }

    /* ── Scroll Reveal ── */
    .reveal {
      opacity: 0;
      transform: translateY(48px);
      transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.in-view {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-bg-top"></div>
        <div class="logo-bg-bottom"></div>
        <div class="logo-text">Wiing<br>chickin</div>
      </a>
      <nav>
        <a href="product.html" class="nav-item active">Product</a>
        <a href="#" class="nav-item">About</a>
        <a href="#" class="nav-item">Credits</a>
      </nav>
      <div class="header-right">
        <img class="union-icon" src="assets/icons/union.svg" alt="">
        <img class="x-icon"     src="assets/icons/x.svg" alt="">
        <img class="samsung-logo-img" src="assets/icons/logo.png" alt="Samsung">
      </div>
    </div>
  </header>

  <!-- PAGE HEADING -->
  <div class="page-heading-section">
    <div class="page-heading-row">
      <h1 class="page-heading">Product.</h1>
    </div>
  </div>

  <!-- PRODUCT CARDS -->
  <div class="product-list">
    <div class="product-card reveal">
      <img src="assets/thumbnail/Gromi-thumbnail.png" alt="Gromi">
      <div class="product-card-info">
        <p class="product-card-name">Gromi</p>
        <p class="product-card-desc">The only companion to grow together</p>
      </div>
    </div>
    <div class="product-card reveal">
      <img src="assets/thumbnail/Weero-thumbnail.png" alt="Weero">
      <div class="product-card-info">
        <p class="product-card-name">Weero</p>
        <p class="product-card-desc">Rise Above. Clean Beyond.</p>
      </div>
    </div>
    <div class="product-card reveal">
      <img src="assets/thumbnail/Flow-thumbnail.png" alt="Flow">
      <div class="product-card-info">
        <p class="product-card-name">Flow</p>
        <p class="product-card-desc">Engineered into the walls. Woven into your life.</p>
      </div>
    </div>
    <div class="product-card reveal">
      <img src="assets/thumbnail/Egg-thumbnail.png" alt="Galaxy Egg">
      <div class="product-card-info">
        <p class="product-card-name">Galaxy Egg</p>
        <p class="product-card-desc">My small companion always by my side</p>
      </div>
    </div>
  </div>

  <script>
    /* ── 반응형 zoom ── */
    function applyZoom() {
      document.documentElement.style.zoom = window.innerWidth / 1920;
    }
    window.addEventListener('resize', applyZoom);
    applyZoom();

    /* ── Scroll Reveal ── */
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('.reveal').forEach((el, i) => {
      el.style.transitionDelay = `${i * 100}ms`;
      observer.observe(el);
    });
  </script>

</body>
</html>
